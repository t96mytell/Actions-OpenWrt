name: immortalwrt-x86_64

on:
  repository_dispatch:
    types: [ImmortalWrt_Update]
  workflow_dispatch:
    inputs:
      repository_owner:
        description: "仓库所有人"
        required: false
        default: "immortalwrt"
      repository_name:
        description: "仓库名"
        required: false
        default: "immortalwrt"
      repository_branch:
        description: "分支"
        required: false
        default: "master"
      enable_ssh:
        description: "Enable SSH debugging?"
        type: boolean
        required: true
        default: false

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      # 兼容两种触发方式：手动触发（workflow_dispatch）和自动触发（repository_dispatch）
      REPO_URL: "https://github.com/${{ github.event.inputs.repository_owner || github.event.client_payload.repository_owner }}/${{ github.event.inputs.repository_name || github.event.client_payload.repository_name }}"
      REPO_BRANCH: ${{ github.event.inputs.repository_branch || github.event.client_payload.repository_branch }}
      FEEDS_CONF: feeds.conf.default
      CONFIG_FILE: config/diffx86_64.config
      DIY_P1_SH: diy-feeds-immortalwrt.sh
      DIY_P2_SH: Modify_default.sh
      UPLOAD_BIN_DIR: false
      UPLOAD_FIRMWARE: true
      UPLOAD_RELEASE: true
      PROJECT_NAME: immortalwrt
      BUILD_NAME: x86_64
      TZ: Asia/Shanghai

    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Initialization environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo bash -c 'bash <(curl -s https://build-scripts.immortalwrt.org/init_build_environment.sh)'
          sudo timedatectl set-timezone "$TZ"
          sudo mkdir -p /mnt/workdir
          sudo chown $USER:$GROUPS /mnt/workdir
          sudo rm -rf /workdir
          sudo ln -s /mnt/workdir /workdir

      - name: Clone source code
        working-directory: /workdir
        run: |
          df -hT $PWD
          git clone $REPO_URL -b $REPO_BRANCH immortalwrt
          ln -sf /workdir/immortalwrt $GITHUB_WORKSPACE/immortalwrt

      - name: Load custom feeds
        run: |
          [ -e $FEEDS_CONF ] && mv $FEEDS_CONF immortalwrt/feeds.conf.default
          chmod +x $DIY_P1_SH
          cd immortalwrt
          $GITHUB_WORKSPACE/$DIY_P1_SH

      - name: Update feeds
        run: cd immortalwrt && ./scripts/feeds update -a

      - name: Install feeds
        run: cd immortalwrt && ./scripts/feeds install -a

      - name: Fix Rust configuration for CI
        run: |
          cd immortalwrt
          echo "修复 Rust 配置以避免 CI 错误..."
          sed -i 's/--set=llvm\.download-ci-llvm=true/--set=llvm.download-ci-llvm=false/' feeds/packages/lang/rust/Makefile

      - name: Load sbwml/packages_lang_golang
        run: |
          cd immortalwrt
          rm -rf feeds/packages/lang/golang
          git clone https://github.com/sbwml/packages_lang_golang -b 24.x feeds/packages/lang/golang

      - name: Replace the same package of the small project with the immortalwrt project lua-neturl
          cd immortalwrt
          echo "用immortalwrt项目lua-neturl替换small项目的相同包以避免错误..."
          rm -rf feeds/small/lua-neturl
          ln -s feeds/packages/lang/lua-neturl feeds/small/lua-neturl

      - name: Load custom configuration
        run: |
          # 移动自定义文件目录（如果存在）
          [ -e files ] && mv files immortalwrt/files
          [ -e $CONFIG_FILE ] && mv $CONFIG_FILE immortalwrt/.config
          chmod +x $DIY_P2_SH
          cd immortalwrt
          $GITHUB_WORKSPACE/$DIY_P2_SH
          make defconfig

      - name: Start SSH Session (Debug)
        if: |
          github.event_name == 'workflow_dispatch' &&
          github.event.inputs.enable_ssh == 'true'
        uses: mxschmitt/action-tmate@v3

      - name: Download package
        id: package
        run: |
          cd immortalwrt
          make download -j$(nproc)
          find dl -size -1024c -exec ls -l {} \;
          find dl -size -1024c -exec rm -f {} \;

      - name: Compile the firmware
        id: compile
        run: |
          cd immortalwrt
          echo -e "$(nproc) thread compile"
          make -j$(nproc) || make -j1 || make -j1 V=s
          echo "status=success" >> $GITHUB_OUTPUT
          grep '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME
          [ -s DEVICE_NAME ] && echo "DEVICE_NAME=_$(cat DEVICE_NAME)" >> $GITHUB_ENV
          echo "FILE_DATE=$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV
          echo "FILE_DATE1=$(date +"%Y年%m月%d日_%H时%M分")" >> $GITHUB_ENV

      - name: Check space usage
        if: (!cancelled())
        run: df -hT

      - name: Upload bin directory
        uses: actions/upload-artifact@main
        if: steps.compile.outputs.status == 'success' && env.UPLOAD_BIN_DIR == 'true'
        with:
          name: OpenWrt_bin${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
          path: immortalwrt/bin

      - name: Organize files
        id: organize
        if: env.UPLOAD_FIRMWARE == 'true' && !cancelled()
        run: |
          cd immortalwrt/bin/targets/*/*
          rm -rf packages *rootfs.tar.gz *rootfs.img.gz *rootfs.img *.bin *.config *.buildinfo *.json sha256sums *.manifest
          echo "FIRMWARE=$PWD" >> $GITHUB_ENV
          echo "status=success" >> $GITHUB_OUTPUT

      - name: Upload firmware directory
        uses: actions/upload-artifact@main
        if: steps.organize.outputs.status == 'success' && !cancelled()
        with:
          name: ${{ env.FILE_DATE }}_${{ env.PROJECT_NAME }}_${{ env.BUILD_NAME }}
          path: ${{ env.FIRMWARE }}

      - name: Generate release tag
        id: tag
        if: env.UPLOAD_RELEASE == 'true' && !cancelled()
        run: |
          # 读取设备型号
          DEVICE_MODEL=$(echo "${{ env.DEVICE_NAME }}" | sed 's/^_//')

          # 组合架构和型号作为分组标识
          GROUP_NAME="${{ env.BUILD_NAME }}_${DEVICE_MODEL}"

          # 生成带分组标识的标签
          echo "release_tag=${GROUP_NAME}_${{ env.FILE_DATE }}" >> $GITHUB_OUTPUT

          # 保存分组标识到环境变量（用于后续删除操作）
          echo "GROUP_NAME=${GROUP_NAME}" >> $GITHUB_ENV

          # 创建 Release 描述文件
          echo "📥 固件下载" > release.txt
          echo "架构: ${{ env.BUILD_NAME }}" >> release.txt
          echo "设备: ${DEVICE_MODEL}" >> release.txt
          echo "编译时间: ${{ env.FILE_DATE1 }}" >> release.txt

          echo "status=success" >> $GITHUB_OUTPUT

      - name: Upload firmware to release
        uses: softprops/action-gh-release@master
        if: steps.tag.outputs.status == 'success' && !cancelled()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.tag.outputs.release_tag }}
          # 添加架构和型号到标题
          name: "${{ env.PROJECT_NAME }} ${{ env.BUILD_NAME }} (${{ steps.tag.outputs.release_tag }})"
          body_path: release.txt
          files: ${{ env.FIRMWARE }}/*

      - name: Delete workflow runs
        uses: Mattraks/delete-workflow-runs@main
        with:
          retain_days: 0
          keep_minimum_runs: 5
          repository: ${{ github.repository }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Delete old releases
        if: ${{ env.UPLOAD_RELEASE == 'true' && !cancelled() }}
        uses: dev-drprasad/delete-older-releases@master
        with:
          keep_latest: 3
          delete_tag_pattern: "${{ env.GROUP_NAME }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
