name: immortalwrt-acrh17(ac42u)

on:
  repository_dispatch:
    types: [ImmortalWrt_Update]
  workflow_dispatch:
    inputs:
      repository_owner:
        description: "仓库所有人"
        required: false
        default: "immortalwrt"
      repository_name:
        description: "仓库名"
        required: false
        default: "immortalwrt"
      repository_branch:
        description: "分支"
        required: false
        default: "master"
      enable_ssh:
        description: "Enable SSH debugging?"
        type: boolean
        required: true
        default: false

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      # 兼容两种触发方式：手动触发（workflow_dispatch）和自动触发（repository_dispatch）
      REPO_URL: "https://github.com/${{ github.event.inputs.repository_owner || github.event.client_payload.repository_owner }}/${{ github.event.inputs.repository_name || github.event.client_payload.repository_name }}"
      REPO_BRANCH: ${{ github.event.inputs.repository_branch || github.event.client_payload.repository_branch }}
      FEEDS_CONF: feeds.conf.default
      CONFIG_FILE: config/immortalwrt_diffacrh17(ac42u).config
      DIY_P1_SH: diy-feeds-immortalwrt.sh
      DIY_P2_SH: modify_default.sh
      UPLOAD_BIN_DIR: false
      UPLOAD_FIRMWARE: true
      UPLOAD_RELEASE: true
      PROJECT_NAME: immortalwrt
      BUILD_NAME: ipq40xx_generic
      TZ: Asia/Shanghai

    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Initialization environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo bash -c 'bash <(curl -s https://build-scripts.immortalwrt.org/init_build_environment.sh)'
          sudo timedatectl set-timezone "$TZ"
          sudo mkdir -p /mnt/workdir
          sudo chown $USER:$GROUPS /mnt/workdir
          sudo rm -rf /workdir
          sudo ln -s /mnt/workdir /workdir

      - name: Clone source code
        working-directory: /workdir
        run: |
          df -hT $PWD
          git clone $REPO_URL -b $REPO_BRANCH immortalwrt
          ln -sf /workdir/immortalwrt $GITHUB_WORKSPACE/immortalwrt

      - name: Load custom feeds
        run: |
          [ -e $FEEDS_CONF ] && mv $FEEDS_CONF immortalwrt/feeds.conf.default
          chmod +x $DIY_P1_SH
          cd immortalwrt
          $GITHUB_WORKSPACE/$DIY_P1_SH

      - name: Update feeds
        run: cd immortalwrt && ./scripts/feeds update -a

      - name: Install feeds
        run: cd immortalwrt && ./scripts/feeds install -a

      - name: Load custom configuration
        run: |
          # 移动自定义文件目录（如果存在）
          [ -e files ] && mv files immortalwrt/files
          [ -e $CONFIG_FILE ] && mv $CONFIG_FILE immortalwrt/.config
          chmod +x $DIY_P2_SH
          cd immortalwrt
          $GITHUB_WORKSPACE/$DIY_P2_SH
          make defconfig

      - name: Start SSH Session (Debug)
        if: |
          github.event_name == 'workflow_dispatch' &&
          github.event.inputs.enable_ssh == 'true'
        uses: mxschmitt/action-tmate@v3

      - name: Download package
        id: package
        run: |
          cd immortalwrt
          make download -j$(nproc)
          find dl -size -1024c -exec ls -l {} \;
          find dl -size -1024c -exec rm -f {} \;

      - name: Compile the firmware
        id: compile
        run: |
          cd immortalwrt
          echo -e "$(nproc) thread compile"
          make -j$(nproc) || make -j1 || make -j1 V=s
          echo "status=success" >> $GITHUB_OUTPUT
          grep '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME
          [ -s DEVICE_NAME ] && echo "DEVICE_NAME=_$(cat DEVICE_NAME)" >> $GITHUB_ENV
          echo "FILE_DATE=$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV
          echo "FILE_DATE1=$(date +"%Y年%m月%d日_%H时%M分")" >> $GITHUB_ENV

      - name: Check space usage
        if: (!cancelled())
        run: df -hT

      - name: Upload bin directory
        uses: actions/upload-artifact@main
        if: steps.compile.outputs.status == 'success' && env.UPLOAD_BIN_DIR == 'true'
        with:
          name: OpenWrt_bin${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
          path: immortalwrt/bin

      - name: Organize files
        id: organize
        if: steps.compile.outputs.status == 'success' && env.UPLOAD_FIRMWARE == 'true' && !cancelled()
        run: |
          cd immortalwrt/bin/targets/*/*
          rm -rf packages *rootfs.tar.gz *rootfs.img.gz *rootfs.img *.config *.buildinfo *.json sha256sums *.manifest
          echo "FIRMWARE=$PWD" >> $GITHUB_ENV
          echo "status=success" >> $GITHUB_OUTPUT

      - name: Upload firmware directory
        uses: actions/upload-artifact@main
        if: steps.compile.outputs.status == 'success' && steps.organize.outputs.status == 'success' && !cancelled()
        with:
          name: ${{ env.FILE_DATE }}_${{ env.PROJECT_NAME }}_${{ env.BUILD_NAME }}
          path: ${{ env.FIRMWARE }}

      - name: Generate release tag
        id: tag
        if: steps.compile.outputs.status == 'success' && env.UPLOAD_RELEASE == 'true' && !cancelled()
        run: |
          # 读取设备型号
          DEVICE_MODEL=$(echo "${{ env.DEVICE_NAME }}" | sed 's/^_//')
          
          # 组合架构和型号作为设备组标识
          GROUP_NAME="${{ env.BUILD_NAME }}_${DEVICE_MODEL}"
          
          # 使用 PROJECT_NAME 和设备组标识生成标签
          RELEASE_TAG="${{ env.PROJECT_NAME }}_${GROUP_NAME}_${{ env.FILE_DATE }}"
          
          echo "release_tag=${RELEASE_TAG}" >> $GITHUB_OUTPUT
          echo "GROUP_NAME=${GROUP_NAME}" >> $GITHUB_ENV
          
          # 创建 Release 描述文件
          echo "📥 固件下载" > release.txt
          echo "架构: ${{ env.BUILD_NAME }}" >> release.txt
          echo "设备: ${DEVICE_MODEL}" >> release.txt
          echo "编译时间: ${{ env.FILE_DATE1 }}" >> release.txt
          
          echo "status=success" >> $GITHUB_OUTPUT
      
      - name: Upload firmware to release
        uses: softprops/action-gh-release@master
        if: steps.compile.outputs.status == 'success' && steps.tag.outputs.status == 'success' && !cancelled()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.tag.outputs.release_tag }}
          name: "${{ env.PROJECT_NAME }} ${{ env.BUILD_NAME }} (${{ steps.tag.outputs.release_tag }})"
          body_path: release.txt
          files: ${{ env.FIRMWARE }}/*
      
      - name: Cleanup workflow runs (CLI)
        if: ${{ success() || failure() }}  # 无论编译成功失败都执行
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          # 获取工作流文件路径
          echo "智能识别工作流文件路径..."
          
          # 使用 github.workflow_ref 获取精确路径
          WORKFLOW_FILE="${{ github.workflow_ref }}"
          WORKFLOW_FILE="${WORKFLOW_FILE#*/}"
          WORKFLOW_FILE="${WORKFLOW_FILE%%@*}"
          
          # 验证路径格式
          if [[ "$WORKFLOW_FILE" != .github/workflows/*.yml ]]; then
            # 如果格式不对，使用工作流名称搜索匹配的文件
            echo "⚠️ 无法通过workflow_ref获取有效路径，尝试搜索工作流文件..."
            WORKFLOW_NAME="${{ github.workflow }}"
            WORKFLOW_FILE=$(find .github/workflows -name '*.yml' -exec grep -l "name:.*$WORKFLOW_NAME" {} + | head -1)
            
            if [[ -z "$WORKFLOW_FILE" ]]; then
              echo "❌ 找不到匹配 '$WORKFLOW_NAME' 的工作流文件"
              exit 0  # 安全退出
            fi
          fi
          
          echo "✅ 确定工作流文件路径: $WORKFLOW_FILE"
          
          # 安装必要工具
          if ! command -v gh jq &>/dev/null; then
            echo "安装 GitHub CLI 和 jq..."
            sudo apt-get update
            sudo apt-get install -y gh jq
          fi
          
          # 登录GitHub
          echo "$GITHUB_TOKEN" | gh auth login --with-token
          
          # 获取工作流ID
          echo "获取工作流ID..."
          WORKFLOW_ID=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows" \
            --jq ".workflows[] | select(.path == \"$WORKFLOW_FILE\").id")
          
          echo "工作流文件: $WORKFLOW_FILE"
          echo "工作流ID: $WORKFLOW_ID"
          
          # 获取运行记录
          echo "获取运行记录..."
          RUNS_JSON=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$WORKFLOW_ID/runs?per_page=100")
          
          # 处理运行记录（保留最近3次）
          KEEP_COUNT=5
          TO_DELETE=()
          
          while read -r id status created_at; do
            # 跳过当前运行
            if [[ "$status" == "in_progress" ]]; then
              echo "⏳ 跳过当前运行: $id (状态: $status)"
              continue
            fi
            
            # 保留最近的运行
            if (( KEEP_COUNT > 0 )); then
              echo "💾 保留运行: $id (创建于: $created_at)"
              ((KEEP_COUNT--))
            else
              TO_DELETE+=("$id")
              echo "🗑️ 标记删除: $id (创建于: $created_at)"
            fi
          done < <(jq -r '.workflow_runs[] | "\(.id) \(.status) \(.created_at)"' <<< "$RUNS_JSON")
          
          # 删除旧运行
          if [[ ${#TO_DELETE[@]} -gt 0 ]]; then
            echo "🚮 删除 ${#TO_DELETE[@]} 个旧运行"
            for id in "${TO_DELETE[@]}"; do
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/runs/$id" --silent
              sleep 0.5  # 避免触发速率限制
            done
          else
            echo "✅ 无需删除旧运行"
          fi
          
          # 清理退出
          gh auth logout
          echo "清理完成"
      
      - name: Cleanup old releases and tags
        if: ${{ steps.compile.outputs.status == 'success' && env.UPLOAD_RELEASE == 'true' && !cancelled() }}
        run: |
          set -e
          
          # 安装必要工具
          if ! command -v jq &> /dev/null; then
            sudo apt-get update
            sudo apt-get install -y jq
          fi
          
          # 获取环境变量
          PROJECT_NAME="${{ env.PROJECT_NAME }}"
          GROUP_NAME="${{ env.GROUP_NAME }}"
          REPOSITORY="${{ github.repository }}"
          
          echo "清理任务: $PROJECT_NAME/$GROUP_NAME"
          
          # 获取所有 Release
          RELEASES=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/$REPOSITORY/releases" | \
            jq -r '.[] | .tag_name + "|" + (.id|tostring) + "|" + .created_at')
          
          # 筛选匹配项
          MATCHING_RELEASES=""
          while IFS='|' read -r TAG ID CREATED_AT; do
            if [[ "$TAG" == *"${PROJECT_NAME}_${GROUP_NAME}_"* ]]; then
              MATCHING_RELEASES+="${TAG}|${ID}|${CREATED_AT}"$'\n'
            fi
          done <<< "$RELEASES"
          
          # 无匹配项时退出
          if [[ -z "$MATCHING_RELEASES" ]]; then
            echo "未找到匹配的 Release"
            exit 0
          fi
          
          # 按创建时间排序（最新的在前）
          SORTED_RELEASES=$(echo "$MATCHING_RELEASES" | sort -t'|' -k3 -r)
          
          # 保留最新的3个
          KEEP_COUNT=3
          KEEP_TAGS=$(echo "$SORTED_RELEASES" | head -n $KEEP_COUNT | cut -d'|' -f1)
          
          # 输出调试信息
          echo "匹配的 Release:"
          echo "$MATCHING_RELEASES"
          echo "保留的 Release:"
          echo "$KEEP_TAGS"
          
          # 删除旧版本
          while IFS='|' read -r TAG ID CREATED_AT; do
            # 检查是否在保留列表中
            if ! echo "$KEEP_TAGS" | grep -qFx "$TAG"; then
              echo "删除: $TAG"
              
              # 删除 Release
              curl -s -X DELETE -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
                "https://api.github.com/repos/$REPOSITORY/releases/$ID"
              
              # 删除 Tag
              curl -s -X DELETE -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
                "https://api.github.com/repos/$REPOSITORY/git/refs/tags/$TAG"
            fi
          done <<< "$SORTED_RELEASES"
          
          # 清理本地标签引用
          git fetch --prune --prune-tags
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
