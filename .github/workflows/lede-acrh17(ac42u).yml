name: lede-acrh17(ac42u)

on:
  repository_dispatch:
    types: [LEDE_Update]
  workflow_dispatch:
    inputs:
      repository_owner:
        description: '仓库所有人'
        required: false
        default: 'coolsnowwolf'
      repository_name:
        description: '仓库名'
        required: false
        default: 'lede'
      repository_branch:
        description: '分支'
        required: false
        default: 'master'
      enable_ssh:
        description: 'Enable SSH debugging?'
        type: boolean
        required: true
        default: false

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      # 兼容两种触发方式：手动触发（workflow_dispatch）和自动触发（repository_dispatch）
      BUILD_DIR: lede
      REPO_URL: "https://github.com/${{ github.event.inputs.repository_owner || github.event.client_payload.repository_owner }}/${{ github.event.inputs.repository_name || github.event.client_payload.repository_name }}"
      REPO_BRANCH: ${{ github.event.inputs.repository_branch || github.event.client_payload.repository_branch }}
      FEEDS_CONF: feeds.conf.default
      CONFIG_FILE: config/lede_diffacrh17(ac42u).config
      DIY_P1_SH: diy-feeds-lede.sh
      DIY_P2_SH: modify_default.sh
      UPLOAD_BIN_DIR: false
      UPLOAD_FIRMWARE: true
      UPLOAD_RELEASE: true
      PROJECT_NAME: lede
      BUILD_NAME: ipq40xx_generic
      TZ: Asia/Shanghai

    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Initialization environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo bash -c 'bash <(curl -s https://build-scripts.immortalwrt.org/init_build_environment.sh)'
          sudo timedatectl set-timezone "$TZ"
          sudo mkdir -p /mnt/workdir
          sudo chown $USER:$GROUPS /mnt/workdir
          sudo rm -rf /workdir
          sudo ln -s /mnt/workdir /workdir

      - name: Clone source code
        working-directory: /workdir
        run: |
          df -hT $PWD
          git clone $REPO_URL -b $REPO_BRANCH $BUILD_DIR
          ln -sf /workdir/$BUILD_DIR $GITHUB_WORKSPACE/$BUILD_DIR

      - name: Cache
        uses: klever1988/cachewrtbuild@main
        with:
          ccache: 'false'
          prefix: ${{ env.BUILD_DIR }}
          toolchain: 'true'
          skip: 'true'
          clean: 'false'
          mixkey: '${{ github.workflow }}'
          skip_saving: 'false'
          
      - name: Load custom feeds
        run: |
          [ -e $FEEDS_CONF ] && mv $FEEDS_CONF $BUILD_DIR/feeds.conf.default
          chmod +x $DIY_P1_SH
          cd $BUILD_DIR
          $GITHUB_WORKSPACE/$DIY_P1_SH

      - name: Update feeds
        run: cd $BUILD_DIR && ./scripts/feeds update -a

      - name: Install feeds
        run: cd $BUILD_DIR && ./scripts/feeds install -a

      - name: Link custom packages
        run: bash $GITHUB_WORKSPACE/link_custom_packages.sh
             
      - name: Load custom configuration
        run: |
          [ -e files ] && mv files $BUILD_DIR/files
          [ -e $CONFIG_FILE ] && mv $CONFIG_FILE $BUILD_DIR/.config
          chmod +x $DIY_P2_SH
          cd $BUILD_DIR
          $GITHUB_WORKSPACE/$DIY_P2_SH
          make defconfig

      - name: Start SSH Session (Debug)
        if: |
          github.event_name == 'workflow_dispatch' &&
          github.event.inputs.enable_ssh == 'true'
        uses: mxschmitt/action-tmate@v3

      - name: Download package
        id: package
        run: |
          cd $BUILD_DIR
          make download -j$(nproc)
          find dl -size -1024c -exec ls -l {} \;
          find dl -size -1024c -exec rm -f {} \;

      - name: Compile the firmware
        id: compile
        run: |
          cd $BUILD_DIR
          echo -e "$(nproc) thread compile"
          make -j$(nproc) || (rm -f build_dir/target-*/inotify-tools-*/ipkg-install/usr/bin/{fsnotifywait,fsnotifywatch} && make -j1) || make -j1 V=s
          echo "status=success" >> $GITHUB_OUTPUT
          grep '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME
          [ -s DEVICE_NAME ] && echo "DEVICE_NAME=_$(cat DEVICE_NAME)" >> $GITHUB_ENV
          echo "FILE_DATE=$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV
          echo "FILE_DATE1=$(date +"%Y年%m月%d日_%H时%M分")" >> $GITHUB_ENV
          
      - name: Check space usage
        if: (!cancelled())
        run: df -hT

      - name: Upload bin directory
        uses: actions/upload-artifact@main
        if: steps.compile.outputs.status == 'success' && env.UPLOAD_BIN_DIR == 'true'
        with:
          name: OpenWrt_bin${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
          path: $BUILD_DIR/bin

      - name: Organize files
        id: organize
        if: steps.compile.outputs.status == 'success' && env.UPLOAD_FIRMWARE == 'true' && !cancelled()
        run: |
          cd $BUILD_DIR/bin/targets/*/*
          rm -rf packages *rootfs.tar.gz *rootfs.img.gz *rootfs.img *.config *.buildinfo *.json sha256sums *.manifest
          echo "FIRMWARE=$PWD" >> $GITHUB_ENV
          echo "status=success" >> $GITHUB_OUTPUT

      - name: Upload firmware directory
        uses: actions/upload-artifact@main
        if: steps.compile.outputs.status == 'success' && steps.organize.outputs.status == 'success' && !cancelled()
        with:
          name: ${{ env.FILE_DATE }}_${{ env.PROJECT_NAME }}_${{ env.BUILD_NAME }}
          path: ${{ env.FIRMWARE }}

      - name: Generate release tag
        id: tag
        if: steps.compile.outputs.status == 'success' && env.UPLOAD_RELEASE == 'true' && !cancelled()
        run: |
          # 读取设备型号
          DEVICE_MODEL=$(echo "${{ env.DEVICE_NAME }}" | sed 's/^_//')
          
          # 组合架构和型号作为设备组标识
          GROUP_NAME="${{ env.BUILD_NAME }}_${DEVICE_MODEL}"
          
          # 使用 PROJECT_NAME 和设备组标识生成标签
          RELEASE_TAG="${{ env.PROJECT_NAME }}_${GROUP_NAME}_${{ env.FILE_DATE }}"
          
          echo "release_tag=${RELEASE_TAG}" >> $GITHUB_OUTPUT
          echo "GROUP_NAME=${GROUP_NAME}" >> $GITHUB_ENV
          
          # 创建 Release 描述文件
          echo "📥 固件下载" > release.txt
          echo "架构: ${{ env.BUILD_NAME }}" >> release.txt
          echo "设备: ${DEVICE_MODEL}" >> release.txt
          echo "编译时间: ${{ env.FILE_DATE1 }}" >> release.txt
          
          echo "status=success" >> $GITHUB_OUTPUT
      
      - name: Upload firmware to release
        uses: softprops/action-gh-release@master
        if: steps.compile.outputs.status == 'success' && steps.tag.outputs.status == 'success' && !cancelled()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.tag.outputs.release_tag }}
          name: "${{ env.PROJECT_NAME }} ${{ env.BUILD_NAME }} (${{ steps.tag.outputs.release_tag }})"
          body_path: release.txt
          files: ${{ env.FIRMWARE }}/*
      
      - name: Cleanup workflow runs
        if: ${{ success() || failure() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          echo "开始清理工作流运行记录。"
          
          # 获取当前运行ID
          CURRENT_RUN_ID=${{ github.run_id }}
          echo "当前运行ID: $CURRENT_RUN_ID"
          
          # 获取工作流文件路径
          WORKFLOW_FILE="${{ github.workflow_ref }}"
          WORKFLOW_FILE="${WORKFLOW_FILE#*/}"
          WORKFLOW_FILE="${WORKFLOW_FILE%%@*}"
          echo "尝试通过 workflow_ref 获取工作流文件路径。"
          
          if [[ "$WORKFLOW_FILE" != .github/workflows/*.yml ]]; then
            echo "无法通过 workflow_ref 获取有效路径，正在尝试通过工作流名称查找匹配的 YAML 文件。"
            WORKFLOW_NAME="${{ github.workflow }}"
            WORKFLOW_FILE=$(find .github/workflows -name '*.yml' -exec grep -l "name:.*$WORKFLOW_NAME" {} + | head -1)
            
            if [[ -z "$WORKFLOW_FILE" ]]; then
              echo "未找到匹配的工作流文件，无法继续清理操作，脚本退出。"
              exit 0
            else
              echo "成功找到匹配的工作流文件路径：$WORKFLOW_FILE"
            fi
          fi
          
          # 安装必要工具
          if ! command -v gh jq &>/dev/null; then
            sudo apt-get update
            sudo apt-get install -y gh jq
          fi
          
          # 获取工作流ID
          echo "正在获取当前工作流在 GitHub 上的唯一标识符（工作流 ID）。"
          WORKFLOW_ID=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows" \
            --jq ".workflows[] | select(.path == \"$WORKFLOW_FILE\").id")
          
          if [[ -z "$WORKFLOW_ID" ]]; then
            echo "未能获取工作流 ID，请检查仓库名称或工作流文件路径是否正确，脚本退出。"
            exit 1
          fi
          
          echo "成功获取工作流 ID：$WORKFLOW_ID"
          
          # 获取工作流运行记录
          echo "正在从 GitHub 获取该工作流的所有运行记录。"
          RUNS_JSON=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$WORKFLOW_ID/runs?per_page=100")
          
          # 保留工作流任务次数
          KEEP_COUNT=5
          TO_DELETE=()
          
          echo "正在分析运行记录，准备删除超出保留数量的历史记录。"
          while read -r id status created_at; do
            # 特殊处理当前运行
            if [[ "$id" == "$CURRENT_RUN_ID" ]]; then
              echo "保留当前运行：ID $id（本次运行），创建时间 $created_at。"
              ((KEEP_COUNT--))
              continue
            fi
            
            if [[ "$status" == "in_progress" ]]; then
              echo "跳过正在进行中的工作流：ID $id，状态为 in_progress。"
              continue
            fi
            
            if (( KEEP_COUNT > 0 )); then
              echo "保留历史工作流运行记录：ID $id，创建时间 $created_at。"
              ((KEEP_COUNT--))
            else
              TO_DELETE+=("$id")
              echo "标记以下工作流运行记录为待删除：ID $id，创建时间 $created_at。"
            fi
          done < <(jq -r '.workflow_runs[] | "\(.id) \(.status) \(.created_at)"' <<< "$RUNS_JSON")
          
          # 删除旧工作流
          if [[ ${#TO_DELETE[@]} -gt 0 ]]; then
            echo "开始删除旧的工作流运行记录。"
            for id in "${TO_DELETE[@]}"; do
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/runs/$id" --silent
              echo "已删除运行记录，ID 为：$id。"
              sleep 0.5
            done
            echo "本次共删除了 ${#TO_DELETE[@]} 条旧的工作流运行记录。"
          else
            echo "没有需要删除的旧工作流运行记录，清理操作已完成。"
          fi
          
          echo "本次工作流运行记录清理任务已完成。"
      
      - name: Cleanup old releases and tags
        if: ${{ steps.compile.outputs.status == 'success' && env.UPLOAD_RELEASE == 'true' && !cancelled() }}
        run: |
          set -e
          
          # 安装必要工具
          if ! command -v jq &> /dev/null; then
            sudo apt-get update
            sudo apt-get install -y jq
          fi
          
          # 获取环境变量
          PROJECT_NAME="${{ env.PROJECT_NAME }}"
          GROUP_NAME="${{ env.GROUP_NAME }}"
          REPOSITORY="${{ github.repository }}"
          
          echo "清理任务: $PROJECT_NAME/$GROUP_NAME"
          
          # 获取所有 Release
          RELEASES=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/$REPOSITORY/releases" | \
            jq -r '.[] | .tag_name + "|" + (.id|tostring) + "|" + .created_at')
          
          # 筛选匹配项
          MATCHING_RELEASES=""
          while IFS='|' read -r TAG ID CREATED_AT; do
            if [[ "$TAG" == *"${PROJECT_NAME}_${GROUP_NAME}_"* ]]; then
              MATCHING_RELEASES+="${TAG}|${ID}|${CREATED_AT}"$'\n'
            fi
          done <<< "$RELEASES"
          
          # 无匹配项时退出
          if [[ -z "$MATCHING_RELEASES" ]]; then
            echo "未找到匹配的 Release"
            exit 0
          fi
          
          # 按创建时间排序（最新的在前）
          SORTED_RELEASES=$(echo "$MATCHING_RELEASES" | sort -t'|' -k3 -r)
          
          # 保留最新的3个
          KEEP_COUNT=3
          KEEP_TAGS=$(echo "$SORTED_RELEASES" | head -n $KEEP_COUNT | cut -d'|' -f1)
          
          # 输出调试信息
          echo "匹配的 Release:"
          echo "$MATCHING_RELEASES"
          echo "保留的 Release:"
          echo "$KEEP_TAGS"
          
          # 删除旧版本
          while IFS='|' read -r TAG ID CREATED_AT; do
            # 检查是否在保留列表中
            if ! echo "$KEEP_TAGS" | grep -qFx "$TAG"; then
              echo "删除: $TAG"
              
              # 删除 Release
              curl -s -X DELETE -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
                "https://api.github.com/repos/$REPOSITORY/releases/$ID"
              
              # 删除 Tag
              curl -s -X DELETE -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
                "https://api.github.com/repos/$REPOSITORY/git/refs/tags/$TAG"
            fi
          done <<< "$SORTED_RELEASES"
          
          # 清理本地标签引用
          git fetch --prune --prune-tags
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
