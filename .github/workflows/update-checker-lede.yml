name: LEDE Update Checker

env:
  REPO_URL: https://github.com/coolsnowwolf/lede
  REPO_BRANCH: master
on:
  workflow_dispatch:
  schedule:
    - cron: '0 22 * * *'

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Get Commit Hash
        id: getHash
        run: |
          commit_hash=$(git ls-remote "$REPO_URL" "refs/heads/$REPO_BRANCH" | awk '{print $1}')
          echo "commitHash=$commit_hash" >> $GITHUB_OUTPUT

      - name: Compare Commit Hash
        id: cacheHash
        uses: actions/cache@v3
        with:
          path: .lede_commitHash
          key: commitHash_${{ steps.getHash.outputs.commitHash }}

      - name: Save New Commit Hash
        if: steps.cacheHash.outputs.cache-hit != 'true'
        run: |
          echo ${{ steps.getHash.outputs.commitHash }} | tee .lede_commitHash

      - name: Commit and push changes
        if: steps.cacheHash.outputs.cache-hit != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .lede_commitHash
          git commit -m "Update LEDE commit hash: ${{ steps.getHash.outputs.commitHash }}"
          git push

      - name: Trigger build
        if: steps.cacheHash.outputs.cache-hit != 'true'
        uses: peter-evans/repository-dispatch@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          event-type: LEDE_Update
          client-payload: |
            {
              "repository_owner": "coolsnowwolf",
              "repository_name": "lede",
              "repository_branch": "master"
            }

      - name: Cleanup workflow runs
        run: |
          WORKFLOW_FILE="${{ steps.get_path.outputs.workflow_path }}"
          GITHUB_TOKEN="${{ secrets.GITHUB_TOKEN }}"
          REPO="${{ github.repository }}"
          CURRENT_RUN_ID=${{ github.run_id }}

          # 获取工作流ID
          WORKFLOW_ID=$(gh api "repos/$REPO/actions/workflows" \
            --jq ".workflows[] | select(.path == \"$WORKFLOW_FILE\").id" \
            -H "Authorization: Bearer $GITHUB_TOKEN")

          if [[ -z "$WORKFLOW_ID" ]]; then
            echo "Error: Failed to get workflow ID."
            exit 1
          fi

          # 获取所有运行记录
          RUNS_JSON=$(gh api "repos/$REPO/actions/workflows/$WORKFLOW_ID/runs?per_page=100" \
            -H "Authorization: Bearer $GITHUB_TOKEN")

          KEEP_COUNT=5
          TO_DELETE=()
          CANDIDATES=()

          # 提取所有已完成的运行记录，并跳过当前运行ID
          while read -r id status created_at; do
            if [[ "$status" == "in_progress" ]]; then
              continue
            fi
            if [[ "$id" == "$CURRENT_RUN_ID" ]]; then
              continue
            fi
            CANDIDATES+=("$id|$created_at")
          done < <(jq -r '.workflow_runs[] | "\(.id) \(.status) \(.created_at)"' <<< "$RUNS_JSON")

          # 添加当前运行ID作为第一条候选
          CANDIDATES=("$CURRENT_RUN_ID|$(date +"%Y-%m-%dT%H:%M:%SZ")" "${CANDIDATES[@]}")

          # 遍历候选列表，保留KEEP_COUNT值定义的个数，其余标记为删除
          for item in "${CANDIDATES[@]}"; do
            IFS='|' read -r id created_at <<< "$item"
            if (( KEEP_COUNT > 0 )); then
              echo "Keeping Run ID: $id | Created at: $created_at"
              ((KEEP_COUNT--))
            else
              echo "Deleting Run ID: $id | Created at: $created_at"
              TO_DELETE+=("$id")
            fi
          done

          if [[ ${#TO_DELETE[@]} -gt 0 ]]; then
            echo "Deleting ${#TO_DELETE[@]} old workflow runs..."
            for id in "${TO_DELETE[@]}"; do
              gh api -X DELETE "repos/$REPO/actions/runs/$id" \
                -H "Authorization: Bearer $GITHUB_TOKEN" --silent
              sleep 0.5
            done
            echo "Successfully deleted ${#TO_DELETE[@]} old workflow runs."
          else
            echo "No old workflow runs to delete."
          fi
