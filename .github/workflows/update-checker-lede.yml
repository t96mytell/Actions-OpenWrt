name: LEDE Update Checker

env:
  REPO_URL: https://github.com/coolsnowwolf/lede
  REPO_BRANCH: master
on:
  workflow_dispatch:
  schedule:
    - cron: '0 22 * * *'

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Get Commit Hash
        id: getHash
        run: |
          commit_hash=$(git ls-remote "$REPO_URL" "refs/heads/$REPO_BRANCH" | awk '{print $1}')
          echo "commitHash=$commit_hash" >> $GITHUB_OUTPUT

      - name: Compare Commit Hash
        id: cacheHash
        uses: actions/cache@v3
        with:
          path: .lede_commitHash
          key: commitHash_${{ steps.getHash.outputs.commitHash }}

      - name: Save New Commit Hash
        if: steps.cacheHash.outputs.cache-hit != 'true'
        run: |
          echo ${{ steps.getHash.outputs.commitHash }} | tee .lede_commitHash

      - name: Commit and push changes
        if: steps.cacheHash.outputs.cache-hit != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .lede_commitHash
          git commit -m "Update LEDE commit hash: ${{ steps.getHash.outputs.commitHash }}"
          git push

      - name: Trigger build
        if: steps.cacheHash.outputs.cache-hit != 'true'
        uses: peter-evans/repository-dispatch@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          event-type: LEDE_Update
          client-payload: |
            {
              "repository_owner": "coolsnowwolf",
              "repository_name": "lede",
              "repository_branch": "master"
            }

      - name: Get workflow path
        id: get_path
        run: |
          # 尝试从 github.workflow_ref 提取路径
          WORKFLOW_PATH="${{ github.workflow_ref }}"
          if [[ "$WORKFLOW_PATH" == *".github/workflows/"* ]]; then
            WORKFLOW_PATH="${WORKFLOW_PATH#*/}"
            WORKFLOW_PATH="${WORKFLOW_PATH%%@*}"
          else
            echo "无法通过 workflow_ref 获取有效路径，尝试通过名称查找。"
            WORKFLOW_NAME="${{ github.workflow }}"
            WORKFLOW_PATH=$(find .github/workflows -name "*.yml" -exec grep -l "name:.*$WORKFLOW_NAME" {} + | head -1)
          fi

          if [[ -z "$WORKFLOW_PATH" ]]; then
            echo "未能找到匹配的工作流文件路径。"
            exit 1
          fi

          echo "Detected workflow file path: $WORKFLOW_PATH"
          echo "workflow_path=$WORKFLOW_PATH" >> "$GITHUB_OUTPUT"

      - name: Delete workflow runs
        uses: Mattraks/delete-workflow-runs@main
        with:
          retain_days: 0
          keep_minimum_runs: 5
          workflow_id: ${{ steps.get_path.outputs.workflow_path }}
          repository: ${{ github.repository }}
          token: ${{ secrets.GITHUB_TOKEN }}
